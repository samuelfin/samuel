name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build runs without Supabase settings on purpose: auth-gated routes must stay
      # request-rendered, so no credentials are needed (or exposed) at build time.
      - run: npm run build

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails on high and critical advisories. A new upstream advisory can turn this
      # red without any change here; that is the intended signal, not a flake.
      - name: Dependency audit
        run: npm run audit:deps

      # Dependency-free scan tuned to this stack's credentials, above all the
      # Supabase secret key. See scripts/scan-secrets.mjs.
      - name: Secret scan
        run: npm run scan:secrets
